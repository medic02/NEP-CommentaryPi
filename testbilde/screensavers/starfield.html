<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="transparent" content="true" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starfield</title>
  <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script src="common.js"></script>
    <script>
      ;(function () {
        const canvas = document.getElementById('canvas')
        const ctx = canvas.getContext('2d')
        const dpr = window.devicePixelRatio || 1
        const img = new Image()
        let aspect = 1.0
        let W = 0,
          H = 0,
          cx = 0,
          cy = 0,
          maxDist = 0
        let lastTime = 0
        const stars = []

        class Star {
          constructor() {
            this.reset(true)
          }
          reset(initial) {
            this.angle = Math.random() * Math.PI * 2
            this.cosA = Math.cos(this.angle)
            this.sinA = Math.sin(this.angle)
            this.speed = 80 + Math.random() * 250
            this.dist = initial ? Math.random() * maxDist : 0
            this.scaleMin = 0.02 + Math.random() * 0.03
            this.scaleMax = 0.08 + Math.random() * 0.15
            this.opacity = 0.5 + Math.random() * 0.5
          }
          update(dt) {
            this.dist += this.speed * dt
            if (this.dist > maxDist) this.reset(false)
          }
          draw(ctx) {
            // Trail ghosts at fixed offsets behind
            for (let i = 0; i < 5; i++) {
              const offset = (i + 1) * 12
              const d = this.dist - offset
              if (d <= 0) continue
              const t = Math.min(1, d / maxDist)
              const s = this.scaleMin + (this.scaleMax - this.scaleMin) * t
              const w = Math.round(W * s)
              const h = Math.round(w / aspect)
              if (w < 4 || h < 4) continue
              const x = cx + this.cosA * d - w / 2
              const y = cy + this.sinA * d - h / 2
              ctx.globalAlpha = this.opacity * (0.4 / (i + 1))
              if (img.complete && img.naturalWidth > 0) ctx.drawImage(img, x, y, w, h)
            }
            // Head
            const t = Math.min(1, this.dist / maxDist)
            const s = this.scaleMin + (this.scaleMax - this.scaleMin) * t
            const w = Math.round(W * s)
            const h = Math.round(w / aspect)
            if (w >= 4 && h >= 4) {
              const x = cx + this.cosA * this.dist - w / 2
              const y = cy + this.sinA * this.dist - h / 2
              ctx.globalAlpha = this.opacity
              if (img.complete && img.naturalWidth > 0) ctx.drawImage(img, x, y, w, h)
            }
            ctx.globalAlpha = 1
          }
        }

        function resize() {
          W = window.innerWidth
          H = window.innerHeight
          cx = W / 2
          cy = H / 2
          maxDist = Math.sqrt(cx * cx + cy * cy) * 1.1
          resizeCanvas(canvas, ctx, dpr, W, H)
          stars.length = 0
          for (let i = 0; i < 40; i++) stars.push(new Star())
        }

        function loop(ts) {
          if (lastTime === 0) lastTime = ts
          const dt = Math.min((ts - lastTime) / 1000, 0.1)
          lastTime = ts
          ctx.clearRect(0, 0, W, H)
          // Sort far → near so distant stars render behind close ones
          stars.sort((a, b) => b.dist - a.dist)
          for (let i = 0; i < stars.length; i++) {
            stars[i].update(dt)
            stars[i].draw(ctx)
          }
          requestAnimationFrame(loop)
        }

        img.onload = () => {
          aspect = img.naturalWidth / img.naturalHeight
          resize()
          requestAnimationFrame(loop)
        }
        img.onerror = () => {
          aspect = 645 / 342
          resize()
          requestAnimationFrame(loop)
        }
        img.src = './NEP-Logo-FC-WHITE-RGB.png'
        window.addEventListener('resize', resize)
      })()
    </script>
  </body>
</html>
